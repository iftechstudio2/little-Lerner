name: Build Little Learner

on:
  push:
    branches: [main]
    paths:
      - 'content/lessons.json'
      - 'templates/**'
      - 'scripts/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build lesson pages
        run: python scripts/build.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pages public/index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Auto-build lessons from content"
            git push
          fi
