name: Build Little Learner
on:
  push:
    branches: [main]
    paths: ['content/**','templates/**','scripts/**','assets/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete static site
        run: python scripts/build.py
      - name: Validate generated site
        run: python scripts/validate.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then echo "No generated changes."; else git commit -m "Auto-build Little Learner site"; git push; fi